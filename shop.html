<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Urban Threads - Shop</title>

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/shop.css">

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">Urban Threads</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="#">Login</a></li>
            </ul>

            <div class="hamburger" id="hamburger">
                &#9776;
            </div>

        </nav>

        <section class="shop-header">
                <h1>Shop the Latest Streetwear</h1>
                <p>Explore our collection of hoodies, t-shirts, sneakers, and accessories.</p>
        </section>

        <section class="search-section">
            <input type="text" placeholder="Search for products..." id="searchBar">
        </section>

        <section class="filter-section">
            <button class="filter-btn active" data-category="All">All</button>
            <button class="filter-btn" data-category="Hoodies">Hoodies</button>
            <button class="filter-btn" data-category="T-Shirts">T-Shirts</button>
            <button class="filter-btn" data-category="Sneakers">Sneakers</button>
            <button class="filter-btn" data-category="Accessories">Accessories</button>
        </section>

        <section class="products">
            <div class="product-grid" id="productsGrid">
                <!-- Products will be dynamically inserted here -->
            </div>

        </section>

        <footer>
            <p>© 2026 Urban Threads. All Rights Reserved.</p>
        </footer>

        <script src="js/navbar.js"></script>
        <script type="module" src="js/shop.js"></script>
    </body>
</html>
