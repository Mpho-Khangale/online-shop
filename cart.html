<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Urban Threads - Cart</title>

        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">Urban Threads</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>

            <div class="hamburger" id="hamburger">
                &#9776;
            </div>

        </nav>

        <main class="cart-container">

        <h1>Your Shopping Cart</h1>


        <div class="cart-content">

            <div class="cart-items" id="cartItems">
                <!-- Cart products will appear here -->

            </div>


            <!-- Cart summary -->

            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">

                    <span>Subtotal</span>
                    <span id="cartTotal"> R0 </span>

                </div>

                <button class="btn checkout-btn" id="checkoutButton"> Checkout </button>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Urban Threads. All Rights Reserved.
        </p>

    </footer>


    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/cart.js"></script>

</body>

</html>
